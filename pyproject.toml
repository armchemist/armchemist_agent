[project]
name = "armchemist-agent"
version = "0.1.0"
description = "ACT and rail orchestration for ARMchemist"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3", "websocket-client>=1.8,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
neo4j = ["neo4j>=5,<7"]
models = ["huggingface-hub>=0.30,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
